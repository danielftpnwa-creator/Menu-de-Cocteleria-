<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú de Cócteles</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--text:#252525;--muted:#707070;--accent:#7a3e2f;--border:#e5ddd2;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{padding:28px 18px 22px;text-align:center;background:var(--accent);color:#fff}
header h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.9;font-size:14px}
main{max-width:900px;margin:auto;padding:18px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 15px;position:sticky;top:0;background:var(--bg);z-index:5}
.filter{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-size:14px}
.filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.card h2{font-size:19px;margin:0 0 8px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:bold;margin-bottom:10px}
.ingredients{font-size:14px;line-height:1.55;color:#555}.empty{text-align:center;padding:35px;color:var(--muted)}
.admin-toggle{display:block;margin:26px auto 10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
#adminPanel{display:none;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:24px}
#adminPanel.open{display:block}.admin-title{font-size:18px;font-weight:bold}.admin-note{font-size:13px;color:var(--muted);margin:5px 0 14px}
.admin-list{display:grid;gap:8px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.admin-item small{display:block;color:var(--muted);margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex:none}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:30px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #999}
input:checked+.slider{background:var(--ok)}input:checked+.slider:before{transform:translateX(20px)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
.actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:15px 18px 30px}
@media(max-width:600px){main{padding:14px}header h1{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🍸 Menú de Cócteles</h1><p>Selecciona tu destilado favorito</p></header>
<main>
<div class="filters" id="filters"></div>
<section id="cocktailGrid" class="grid"></section>
<div id="empty" class="empty" style="display:none">No hay cócteles disponibles en esta categoría.</div>

<button class="admin-toggle" onclick="toggleAdmin()">⚙️ Modo administrador</button>
<section id="adminPanel">
<div class="admin-title">Disponibilidad del evento</div>
<p class="admin-note">Activa o desactiva las bebidas según lo que haya disponible. Los cambios se guardan en este navegador.</p>
<div class="admin-list" id="adminList"></div>
<div class="actions">
<button class="primary" onclick="activateAll()">Activar todos</button>
<button onclick="deactivateAll()">Desactivar todos</button>
<button onclick="resetAvailability()">Restablecer</button>
</div>
</section>
</main>
<footer>Menú de cócteles · Configuración del evento</footer>

<script>
const cocktails=[
{id:"margarita",name:"Margarita clásica",spirit:"Tequila",ingredients:"Tequila · jugo de limón · licor de naranja · sal · hielo"},
{id:"sunrise-t",name:"Tequila Sunrise",spirit:"Tequila",ingredients:"Tequila · jugo de naranja · granadina · hielo"},
{id:"paloma",name:"Paloma",spirit:"Tequila",ingredients:"Tequila · Squirt · jugo de limón · hielo"},
{id:"cantarito",name:"Cantarito",spirit:"Tequila",ingredients:"Tequila · jugo de naranja · jugo de limón · Squirt · sal · hielo"},

{id:"pina",name:"Piña Colada",spirit:"Ron",ingredients:"Ron · jugo de piña · crema de coco · leche evaporada · hielo"},
{id:"daiquiri",name:"Daiquiri clásico",spirit:"Ron",ingredients:"Ron · jugo de limón · jarabe natural · hielo"},
{id:"cuba",name:"Cuba Libre",spirit:"Ron",ingredients:"Ron · Coca-Cola · jugo de limón · hielo"},
{id:"bull",name:"Bull",spirit:"Ron",ingredients:"Ron · jugo de limón · jarabe natural · cerveza oscura · hielo"},

{id:"sour-w",name:"Whisky Sour",spirit:"Whisky",ingredients:"Whisky · jugo de limón · jarabe natural · hielo"},
{id:"coke-w",name:"Whisky & Coke",spirit:"Whisky",ingredients:"Whisky · Coca-Cola · hielo"},
{id:"sunrise-w",name:"Whisky Sunrise",spirit:"Whisky",ingredients:"Whisky · jugo de naranja · granadina · hielo"},
{id:"manzanita",name:"Whisky con Manzanita",spirit:"Whisky",ingredients:"Whisky · Manzanita · hielo"},

{id:"jamaica-m",name:"Mezcalita de Jamaica",spirit:"Mezcal",ingredients:"Mezcal · jamaica · jugo de limón · jarabe natural · Tajín · hielo"},
{id:"paloma-m",name:"Mezcal Paloma",spirit:"Mezcal",ingredients:"Mezcal · Squirt · jugo de limón · hielo"},
{id:"sunrise-m",name:"Mezcal Sunrise",spirit:"Mezcal",ingredients:"Mezcal · jugo de naranja · granadina · hielo"},
{id:"sour-m",name:"Mezcal Sour",spirit:"Mezcal",ingredients:"Mezcal · jugo de limón · jarabe natural · hielo"},

{id:"chelada",name:"Chelada",spirit:"Cerveza",ingredients:"Cerveza clara · jugo de limón · sal · hielo"},
{id:"michelada",name:"Michelada",spirit:"Cerveza",ingredients:"Cerveza · jugo de limón · sal · Tajín · hielo"}
];

const spirits=["Todos","Tequila","Ron","Whisky","Mezcal","Cerveza"];
let currentSpirit="Todos";
const defaults=Object.fromEntries(cocktails.map(c=>[c.id,true]));
let availability=JSON.parse(localStorage.getItem("cocktailAvailability")||"null")||{...defaults};

function save(){localStorage.setItem("cocktailAvailability",JSON.stringify(availability))}
function filters(){
document.getElementById("filters").innerHTML=spirits.map(s=>`<button class="filter ${s===currentSpirit?"active":""}" onclick="setSpirit('${s}')">${s}</button>`).join("");
}
function menu(){
const visible=cocktails.filter(c=>availability[c.id]&&(currentSpirit==="Todos"||c.spirit===currentSpirit));
document.getElementById("cocktailGrid").innerHTML=visible.map(c=>`<article class="card"><div class="tag">${c.spirit}</div><h2>${c.name}</h2><div class="ingredients">${c.ingredients}</div></article>`).join("");
document.getElementById("empty").style.display=visible.length?"none":"block";
}
function admin(){
document.getElementById("adminList").innerHTML=cocktails.map(c=>`<div class="admin-item"><div><strong>${c.name}</strong><small>${c.spirit}</small></div><label class="switch"><input type="checkbox" ${availability[c.id]?"checked":""} onchange="setAvailability('${c.id}',this.checked)"><span class="slider"></span></label></div>`).join("");
}
function setSpirit(s){currentSpirit=s;filters();menu()}
function setAvailability(id,v){availability[id]=v;save();menu()}
function toggleAdmin(){document.getElementById("adminPanel").classList.toggle("open");admin()}
function activateAll(){cocktails.forEach(c=>availability[c.id]=true);save();admin();menu()}
function deactivateAll(){cocktails.forEach(c=>availability[c.id]=false);save();admin();menu()}
function resetAvailability(){availability={...defaults};save();admin();menu()}
filters();menu();
</script>
</body>
</html>
